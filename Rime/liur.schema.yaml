#錯誤查看%TEMP%\rime.weasel
# Rime schema settings
# encoding: utf-8
#
schema:
  schema_id: liur
  name: 蝦米輸入法
  version: "20261027"
  author:
    - 制作人
  description: |
    蝦米-拼音-注音反查輸入法
  dependencies:
    - liur_simplified
    - liur_japanese
    - liur_readings

switches:
  - name: ascii_mode
    reset: 0
    # states: [ 中文, 英文 ]
  - name: full_shape
    # states: [ 半形, 全形 ]
  - name: liu_w2c
    reset: 0
    states: [ 正常 ,反查 ]
  - name: extended_charset
    states: [ 常用, 擴充字集 ]
    reset: 0
  - name: simplification
    states: [ 繁體, 简体 ]
  - name: zh_tw
    reset: 1
  - options: [ liur_traditional, liur_simplified, liur_trad_to_simp, liur_japanese ]
    reset: 0
    states: [ 繁體, 簡體字碼, 打繁出簡, 日文 ]
  - name: liur_proofread
    reset: 1
    states: [ 關閉校錯, 校錯提示 ]

engine:
  processors:
    - ascii_composer
    - lua_processor@*liur_proofreader*processor
    - lua_processor@*liur_features*processor
    - recognizer
    - key_binder
    - speller
#    - punctuator
    - selector
    - navigator
    - express_editor
#    - fluency_editor	#  語句流
  segmentors:
    - ascii_segmentor
    - matcher
    - lua_segmentor@*liur_features*segmentor
    - abc_segmentor
    - affix_segmentor@mkst
    - affix_segmentor@liurqry
    - affix_segmentor@pinyin
    - affix_segmentor@phonetic
    - affix_segmentor@homophone
#    - punct_segmentor
    - fallback_segmentor
  translators:
    - lua_translator@*liur_features*translator
#    - echo_translator
#    - punct_translator
#    - script_translator
    - table_translator@mkst
    - table_translator@fixed
    - table_translator@liurqry
    - table_translator
    - script_translator@pinyin
    - script_translator@phonetic
    - table_translator@liur_simplified
    - table_translator@liur_japanese
    - script_translator@homophone_readings

  filters:
    - simplifier
    - simplifier@liur_trad_to_simp
    - simplifier@liur_simplified_output
    - simplifier@liu_w2c	#無蝦米字碼反查
    - simplifier@zh_tw
    - uniquifier	#過濾重複的候選字，有可能來自繁簡轉換
    - reverse_lookup_filter@phonetic_reverse_lookup
    - lua_filter@*liur_proofreader*filter
    # - single_char_filter  #單字優先

# abc_segmentor:
  # extra_tags:
    # - liurqry

liu_w2c:
  opencc_config: liu_w2c.json
  option_name: liu_w2c
  show_in_comment: true
  tags: [ pinyin, mkst, phonetic ]
  tips: all

zh_tw:	#只針對拼音及注音反查進行台灣用語轉換
  opencc_config: t2tw.json
  option_name: zh_tw
  tags: [ pinyin, phonetic ]

simplifier:
  tips: all	# 簡化字模式下提示對應的傳統漢字

liur_trad_to_simp:
  option_name: liur_trad_to_simp
  opencc_config: t2s.json
  tags: [ abc, mkst, liurqry, pinyin, phonetic, homophone, homophone_result ]
  excluded_types: [ liur_command ]

liur_simplified_output:
  option_name: liur_simplified
  opencc_config: t2s.json
  excluded_types: [ liur_command ]

# 各語言獨立分段，避免不同字型的候選字混在一起。
liur_simplified:
  tag: liur_simplified
  dictionary: liur_TradToSimp
  enable_user_dict: false
  enable_sentence: false
  enable_completion: true

liur_japanese:
  tag: liur_japanese
  dictionary: liur_Japan
  enable_user_dict: false
  enable_sentence: false
  enable_completion: true

homophone:
  __include: /translator
  tag: homophone
  prefix: "'"
  tips: 【選擇同音原字】

homophone_simplified:
  __include: /homophone
  dictionary: liur_TradToSimp

homophone_japanese:
  __include: /homophone
  dictionary: liur_Japan

# Lua Memory 使用原生地球拼音詞庫，精確查詢包含聲調的讀音。
homophone_readings:
  tag: homophone_readings
  dictionary: terra_pinyin
  prism: liur_readings
  enable_user_dict: false
  enable_completion: false

speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz[];',."
  delimiter: "`"
  algebra:
    - xform/^~(.*)$/$1
#為了加強造詞準確性，在字典中，以「~」前綴標記非標準拆字，再透過拼寫語法去除「~」後，送入辭典查詢

translator:
  dictionary: liur.extended
  db_class: tabledb
  enable_user_dict: false
  enable_sentence: false
  enable_encoder: false
  enable_charset_filter: true
  encode_commit_history: false
  max_phrase_length: 10
  enable_completion: true
  comment_format:
    - xform/^~(.+)$/>[$1]   #將提示碼改為較美觀的型式
  disable_user_dict_for_patterns:
    - "^[',.].*$"
  initial_quality: 1000

fixed:
  __include: /translator
  enable_encoder: true
  enable_user_dict: true
  initial_quality: 100

mkst:
  __include: /translator
  enable_sentence: true
  prefix: ';'
  tips: "〔造詞〕"
  tag: mkst
  initial_quality: 10

liurqry:
  __include: /translator
  prefix: ";;"
  suffix: "'"
  tips: 【反查讀音】
  closing_tips: 【蝦米】
  initial_quality: 300	# 調整該編譯器出字優先度
  tag: liurqry

pinyin:
  tag: pinyin
  dictionary: luna_pinyin
  prefix: "`"
# 漢語拼音輸入以「`」引導
  suffix: "'"
  preedit_format: &pinyin
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/
  tips: 【拼音】
  closing_tips: 【蝦米】
  initial_quality: 0.2	# 調整該編譯器出字優先度

phonetic:
  tag: phonetic
  prefix: "';"
  suffix: "'"
  dictionary: terra_pinyin
  prism: bopomofo_tw
  preedit_format:	#menu反查之輸入法 顯示
    - "xlit|1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/- 6347'|ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙㄧㄨㄩㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦˉˊˇˋ˙ |"
  comment_format:	#menu 提示 字碼 顯示
    - "xlit|abcdefghijklmnopqrstuvwxyz[];',.|abcdefghijklmnopqrstuvwxyz[];',.|"
  tips: 【注音】
  closing_tips: 【蝦米】
  initial_quality: 1.1	# 調整該編譯器出字優先度

phonetic_reverse_lookup:
  tags: [ liurqry ]
  dictionary: terra_pinyin
  overwrite_comment: true  # 覆蓋其他提示
  comment_format:
    - "xform/e?r5$/er5/"
    - "xform/iu/iou/"
    - "xform/ui/uei/"
    - "xform/ong/ung/"
    - "xform/yi?/i/"
    - "xform/wu?/u/"
    - "xform/iu/v/"
    - "xform/([jqx])u/$1v/"
    - "xform/([iuv])n/$1en/"
    - "xform/zh/Z/"
    - "xform/ch/C/"
    - "xform/sh/S/"
    - "xform/ai/A/"
    - "xform/ei/I/"
    - "xform/ao/O/"
    - "xform/ou/U/"
    - "xform/ang/K/"
    - "xform/eng/G/"
    - "xform/an/M/"
    - "xform/en/N/"
    - "xform/er/R/"
    - "xform/eh/E/"
    - "xform/([iv])e/$1E/"
    - "xform/1//"
    - "xlit|bpmfdtnlgkhjqxZCSrzcsiuvaoeEAIOUMNKGR2345|ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙㄧㄨㄩㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦˊˇˋ˙|"
    - xform/ /} {/
    - xform/^/ {
    - xform/$/}/

punctuator:
#  import_preset: default
#  import_preset: alternative

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  use_space: true  # 讓注音的一聲空白鍵先由 recognizer 處理

  patterns:
    email: ^[a-z][-_.0-9a-z]*@.*$
    url: ^(www[.]|https?:|ftp:|mailto:).*$
    liur_command: "^,,(?:c|ct|j|t)?$"
    homophone: "^'[a-z]+$"
    homophone_result: "^'=.+$"
    # 每個音節可接一個聲調（空白為一聲）；再按空白則交給選字流程。
    # 「-」為「ㄦ」，放在字元集合最後，避免被視為範圍。
    phonetic: "';(?:[1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/-]+[ 6347])*[1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/-]*'?$"
# 注音反查引導鍵
    pinyin: "`[a-z']*'?$"
# 漢語拼音輸入引導鍵
    mkst: "^;[a-z,.'`]*$"
#造詞引導
    liurqry: ";;[a-z']*'?$"
# 讀音反查引導鍵
